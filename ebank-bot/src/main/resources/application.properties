spring.application.name=ebank-bot
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:votre_cle_ici}
spring.ai.openai.chat.options.model=llama3-8b-8192
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8070
spring.ai.mcp.client.streamable-http.connections.customers.url=http://localhost:8066/mcp
spring.ai.mcp.client.streamable-http.connections.accounts.url=http://localhost:8067/mcp
discord.enabled=false
telegram.enabled=true
telegram.token=${Telegram_BOT_TOKEN:votre_token_ici}
eureka.client.jersey.enabled=false
discord.token=${DISCORD_BOT_TOKEN:votre_token_ici}
