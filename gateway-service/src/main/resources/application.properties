spring.application.name=gateway-service
server.port=9999

# Activer le routage dynamique automatique basé sur Eureka
spring.cloud.gateway.discovery.locator.enabled=true

# (Optionnel) Pour utiliser des minuscules dans les URLs (/customer-service au lieu de /CUSTOMER-SERVICE)
spring.cloud.gateway.discovery.locator.lower-case-service-id=true